# Publishes @zanehu-ai/x-ui to the public npm registry when a v* tag is pushed.
# The repository secret NPM_TOKEN is not created yet. This workflow does not
# run on pull requests. Do not push a tag until the secret exists and the
# release is approved.
name: Publish to npm

on:
  push:
    tags: ['v*']

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org

      - run: npm ci

      - name: TypeScript Check
        run: npx tsc --noEmit

      - name: Validate release version and choose package channel
        id: release
        run: |
          version=$(node -p 'require("./package.json").version')
          if [[ "$GITHUB_REF_NAME" != "v$version" ]]; then
            echo "::error::Release tag must match package.json version v$version"
            exit 1
          fi
          channel=latest
          if [[ "$version" == *-* ]]; then
            channel=next
          fi
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Publish to the public npm registry
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [[ -z "${NODE_AUTH_TOKEN}" ]]; then
            echo "::error::Missing GitHub Actions secret NPM_TOKEN. Add a granular npm access token before tagging a release."
            exit 1
          fi
          npm publish --provenance --access public --tag "${{ steps.release.outputs.channel }}"
