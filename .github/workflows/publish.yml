name: Release

on:
  push:
    tags: ['x-ui-v*']

permissions:
  contents: read

concurrency:
  group: x-ui-release-${{ github.ref }}
  cancel-in-progress: false

env:
  WRANGLER_VERSION: "4.147.0"

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - run: npm ci

      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#x-ui-v}"
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is version '${tag}', but package.json is '${pkg}'"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: |
          set -euo pipefail
          if node -e "const s=require('./package.json').scripts||{}; if(!s.test) process.exit(1)"; then
            npm test
          else
            echo "No test script; skipping."
          fi

      - name: Build package
        run: npm run build

      - name: Build web assets
        run: |
          set -euo pipefail
          bash scripts/r2-web-release.sh require-build-web
          npm run build:web
          bash scripts/r2-web-release.sh check-outputs

      - name: Upload web dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - run: npm ci

      - name: Fail if version is already published
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          name="$(node -p "require('./package.json').name")"
          version="$(node -p "require('./package.json').version")"
          if npm view "${name}@${version}" version > /tmp/npm-view.out 2> /tmp/npm-view.err; then
            echo "::error::${name}@$(tr -d '[:space:]' < /tmp/npm-view.out) is already published"
            exit 1
          fi
          if ! grep -q E404 /tmp/npm-view.err; then
            echo "::error::Could not confirm whether ${name}@${version} is already published"
            cat /tmp/npm-view.err
            exit 1
          fi

      - name: Pack
        run: npm pack

      - name: Attest build provenance
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: zanehu-ai-synapse-ui-*.tgz

      - name: Publish
        run: npm publish zanehu-ai-synapse-ui-*.tgz
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Append-only. R2 object-write tokens can also delete; this job never deletes.
  # CORS is not applied here. web/dist comes from the verify artifact.
  deploy-web:
    needs: [verify, publish]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    env:
      # TBD: replace with the R2 bucket name once the bucket exists.
      R2_BUCKET: TBD
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download web dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: web/dist

      - name: Set version prefix
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').version")"
          echo "VERSION_PREFIX=x-ui-v${pkg}" >> "$GITHUB_ENV"

      - name: Upload web dist to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/r2-web-release.sh upload

  release-notes:
    needs: [verify, deploy-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Download web dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: web/dist

      - name: Record SRI in the job summary and release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').version")"
          prefix="x-ui-v${pkg}"
          sri="$(bash scripts/r2-web-release.sh sri)"
          css_sri="$(printf '%s\n' "$sri" | awk '$1=="x-ui.css"{print $2}')"
          theme_sri="$(printf '%s\n' "$sri" | awk '$1=="theme-script.js"{print $2}')"
          if [ -z "$css_sri" ] || [ -z "$theme_sri" ]; then
            echo "::error::failed to compute SRI hashes"
            exit 1
          fi
          css_url="https://ui.zanehu.ai/${prefix}/x-ui.css"
          theme_url="https://ui.zanehu.ai/${prefix}/theme-script.js"
          {
            echo "### Web assets"
            echo ""
            echo "- ${css_url}"
            echo "- x-ui.css SRI: \`${css_sri}\`"
            echo "- ${theme_url}"
            echo "- theme-script.js SRI: \`${theme_sri}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          section="$(mktemp)"
          printf '### Web assets\n\n`x-ui.css` SRI: `%s`\n\n%s\n\n`theme-script.js` SRI: `%s`\n\n%s\n' \
            "$css_sri" "$css_url" "$theme_sri" "$theme_url" > "$section"

          notes="$(mktemp)"
          if gh release view "$GITHUB_REF_NAME" --json body --jq .body > "$notes" 2>/dev/null; then
            if ! grep -Fq "$css_sri" "$notes" || ! grep -Fq "$theme_sri" "$notes"; then
              printf '\n' >> "$notes"
              cat "$section" >> "$notes"
              gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$section"
          fi
