name: Release

on:
  push:
    tags: ['x-ui-v*']

permissions:
  contents: read

concurrency:
  group: x-ui-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Require the tag commit to be on main
        run: |
          set -euo pipefail
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::${GITHUB_SHA} is not an ancestor of origin/main. Release tags must point at main."
            exit 1
          fi

      - run: npm ci

      - name: Verify tag matches package.json version
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME#x-ui-v}"
          if ! [[ "$tag" =~ ^[0-9]{4}\.(1[0-2]|[1-9])\.[1-9][0-9]*$ ]]; then
            echo "::error::Tag version '${tag}' must match ^[0-9]{4}.(1[0-2]|[1-9]).[1-9][0-9]*$ (no zero-padded month; npm rejects 2026.09.1)"
            exit 1
          fi
          pkg="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$pkg" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} is version '${tag}', but package.json is '${pkg}'"
            exit 1
          fi

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: |
          set -euo pipefail
          if node -e "const s=require('./package.json').scripts||{}; if(!s.test) process.exit(1)"; then
            npm test
          else
            echo "No test script; skipping."
          fi

      - name: Build package
        run: npm run build

      - name: Build web assets
        run: |
          set -euo pipefail
          bash scripts/r2-web-release.sh require-build-web
          npm run build:web
          bash scripts/r2-web-release.sh check-outputs

      - name: Pack npm tarball
        id: pack
        run: |
          set -euo pipefail
          npm pack --silent --json > "${RUNNER_TEMP}/npm-pack.json"
          filename="$(node -e 'const fs=require("fs"); const j=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); if(!Array.isArray(j)||!j[0]||!j[0].filename) process.exit(1); process.stdout.write(j[0].filename)' "${RUNNER_TEMP}/npm-pack.json")"
          case "$filename" in
            ./*) tarball="$filename" ;;
            *) tarball="./${filename}" ;;
          esac
          test -f "$tarball"
          echo "tarball=${tarball}" >> "$GITHUB_OUTPUT"

      - name: Upload web dist
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: web-dist
          path: web/dist
          if-no-files-found: error

      - name: Upload npm tarball
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: npm-tarball
          path: ${{ steps.pack.outputs.tarball }}
          if-no-files-found: error

  attest:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Download web dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: web/dist

      - name: Download npm tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarball
          path: pack

      - name: Check attested paths
        id: pack
        run: |
          set -euo pipefail
          bash scripts/r2-web-release.sh check-outputs
          shopt -s nullglob
          tarballs=(pack/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ] || [ ! -f "${tarballs[0]}" ]; then
            echo "::error::expected exactly one npm tarball"
            exit 1
          fi
          echo "tarball=./${tarballs[0]}" >> "$GITHUB_OUTPUT"

      - name: Attest npm tarball and web dist
        uses: actions/attest-build-provenance@e8998f949152b193b063cb0ec769d69d929409be # v2.4.0
        with:
          subject-path: |
            ${{ steps.pack.outputs.tarball }}
            web/dist/x-ui.css
            web/dist/theme-script.js
            web/dist/xui.js
            web/dist/manifest.json
            web/dist/fonts/**

  # Read-only. npm publish does not run unless this passes.
  r2-preflight:
    needs: verify
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      # TBD: replace with the R2 bucket name once the bucket exists.
      R2_BUCKET: TBD
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - run: npm ci --ignore-scripts

      - name: Download web dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: web/dist

      - name: Set version prefix
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').version")"
          echo "VERSION_PREFIX=x-ui-v${pkg}" >> "$GITHUB_ENV"

      - name: Preflight R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          if [ -z "${CLOUDFLARE_API_TOKEN:-}" ] || [ -z "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID must be set on the release environment"
            exit 1
          fi
          bash scripts/r2-web-release.sh preflight

  publish:
    needs: [attest, r2-preflight]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://npm.pkg.github.com

      - name: Download npm tarball
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: npm-tarball
          path: pack

      - name: Compare registry integrity
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tarballs=(pack/*.tgz)
          if [ "${#tarballs[@]}" -ne 1 ] || [ ! -f "${tarballs[0]}" ]; then
            echo "::error::expected exactly one attested npm tarball"
            exit 1
          fi
          # npm parses pack/<name>.tgz as a GitHub shorthand. Keep the file prefix.
          echo "tarball=./${tarballs[0]}" >> "$GITHUB_ENV"
          tarball="./${tarballs[0]}"
          case "$tarball" in
            ./*|"$PWD"/*) ;;
            *)
              echo "::error::npm tarball path must start with ./ or \$PWD"
              exit 1
              ;;
          esac
          test -f "$tarball"
          meta="${RUNNER_TEMP}/npm-pack-meta"
          mkdir -p "$meta"
          tar -xzf "$tarball" -C "$meta" package/package.json
          export PACK_JSON="${meta}/package/package.json"
          export TARBALL="$tarball"
          name="$(node -p 'require(process.env.PACK_JSON).name')"
          version="$(node -p 'require(process.env.PACK_JSON).version')"
          local_integrity="$(node -e 'const fs=require("fs"); const crypto=require("crypto"); const hash=crypto.createHash("sha512").update(fs.readFileSync(process.env.TARBALL)).digest("base64"); process.stdout.write("sha512-"+hash);')"
          if npm view "${name}@${version}" dist.integrity --json > /tmp/npm-view.out 2> /tmp/npm-view.err; then
            remote_integrity="$(node -e 'const fs=require("fs"); const raw=fs.readFileSync("/tmp/npm-view.out","utf8").trim(); let value=raw; try { const parsed=JSON.parse(raw); value=typeof parsed==="string"?parsed:""; } catch (e) {} if(!value.startsWith("sha512-")) process.exit(2); process.stdout.write(value);')"
            if [ "$remote_integrity" = "$local_integrity" ]; then
              echo "skip_publish=true" >> "$GITHUB_ENV"
              echo "${name}@${version} is already published with matching dist.integrity; skipping publish."
              exit 0
            fi
            echo "::error::${name}@${version} is already published with a different dist.integrity"
            exit 1
          fi
          if ! grep -q E404 /tmp/npm-view.err; then
            echo "::error::Could not read dist.integrity for ${name}@${version}"
            cat /tmp/npm-view.err
            exit 1
          fi
          echo "skip_publish=false" >> "$GITHUB_ENV"

      - name: Publish
        if: env.skip_publish != 'true'
        run: npm publish "${tarball}"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Append-only. R2 object-write tokens can also delete; this job never deletes.
  # CORS is not applied here. Only the web/dist allowlist is uploaded.
  deploy-web:
    needs: [verify, r2-preflight, publish]
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    env:
      # TBD: replace with the R2 bucket name once the bucket exists.
      R2_BUCKET: TBD
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - run: npm ci --ignore-scripts

      - name: Download web dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: web/dist

      - name: Set version prefix
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').version")"
          echo "VERSION_PREFIX=x-ui-v${pkg}" >> "$GITHUB_ENV"

      - name: Upload web dist to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: bash scripts/r2-web-release.sh upload

  release-notes:
    needs: [verify, deploy-web]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22

      - name: Download web dist
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: web-dist
          path: web/dist

      - name: Record SRI in the job summary and release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          pkg="$(node -p "require('./package.json').version")"
          prefix="x-ui-v${pkg}"
          sri="$(bash scripts/r2-web-release.sh sri)"
          css_sri="$(printf '%s\n' "$sri" | awk '$1=="x-ui.css"{print $2}')"
          theme_sri="$(printf '%s\n' "$sri" | awk '$1=="theme-script.js"{print $2}')"
          xui_sri="$(printf '%s\n' "$sri" | awk '$1=="xui.js"{print $2}')"
          if [ -z "$css_sri" ] || [ -z "$theme_sri" ] || [ -z "$xui_sri" ]; then
            echo "::error::failed to compute SRI hashes"
            exit 1
          fi
          css_url="https://ui.zanehu.ai/${prefix}/x-ui.css"
          theme_url="https://ui.zanehu.ai/${prefix}/theme-script.js"
          xui_url="https://ui.zanehu.ai/${prefix}/xui.js"
          {
            echo "### Web assets"
            echo ""
            echo "- ${css_url}"
            echo "- x-ui.css SRI: \`${css_sri}\`"
            echo "- ${theme_url}"
            echo "- theme-script.js SRI: \`${theme_sri}\`"
            echo "- ${xui_url}"
            echo "- xui.js SRI: \`${xui_sri}\`"
          } >> "$GITHUB_STEP_SUMMARY"

          section="$(mktemp)"
          printf '### Web assets\n\n`x-ui.css` SRI: `%s`\n\n%s\n\n`theme-script.js` SRI: `%s`\n\n%s\n\n`xui.js` SRI: `%s`\n\n%s\n' \
            "$css_sri" "$css_url" "$theme_sri" "$theme_url" "$xui_sri" "$xui_url" > "$section"

          notes="$(mktemp)"
          if gh release view "$GITHUB_REF_NAME" --json body --jq .body > "$notes" 2>/dev/null; then
            if ! grep -Fq "$css_sri" "$notes" || ! grep -Fq "$theme_sri" "$notes" || ! grep -Fq "$xui_sri" "$notes"; then
              printf '\n' >> "$notes"
              cat "$section" >> "$notes"
              gh release edit "$GITHUB_REF_NAME" --notes-file "$notes"
            fi
          else
            gh release create "$GITHUB_REF_NAME" \
              --verify-tag \
              --title "$GITHUB_REF_NAME" \
              --notes-file "$section"
          fi
